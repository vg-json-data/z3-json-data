name: Run Scripts

# Runs manually from the Actions tab, or weekly on Sundays at 18:00 UTC.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

# Opening the pull request with GITHUB_TOKEN requires "Allow GitHub Actions to create and approve pull requests"
# in the repository settings. Such pull requests do not trigger other workflows, so this job validates its result.
permissions:
  contents: write
  pull-requests: write

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/populate_strat_ids.py
      - run: python scripts/autoformat.py
      - run: python scripts/validate.py
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Run scripts
          title: Run Scripts
          body: Assigns missing strat IDs and applies the autoformatter. This pull request is generated by the Run Scripts workflow.
          branch: auto-run-scripts
          delete-branch: true
